<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bildstöd – Dagsplanerare</title>
  <style>
    :root{
      /* Light theme colors */
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #fafafa;
      --card: #ffffff;
      --card-done: #e0ffe0;
      --text: #111827;
      --muted: #6b7280;
      --accent: #22c55e;
      --accent-2: #60a5fa;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ring: rgba(96,165,250,0.8);
      --radius: 18px;
    }

    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header{
      position: sticky; top:0; z-index:10;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(250,250,250,0.9));
      border-bottom: 1px solid rgba(148,163,184,0.15);
      padding: 10px 12px;
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    }
    header .title{
      font-weight: 800;
      letter-spacing: 0.3px;
      font-size: 18px;
      margin-right: auto;
      display:flex; align-items:center; gap:8px;
    }
    header .pill{
      font-size: 12px; color: var(--muted);
      background: rgba(148,163,184,0.12);
      padding: 4px 8px; border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.2);
    }

    .btn{
      border: 1px solid rgba(148,163,184,0.25);
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(96,165,250,0.6); }
    .btn:active{ transform: translateY(0); }
    .btn.primary{ background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); }
    .btn.blue{ background: rgba(96,165,250,0.12); border-color: rgba(96,165,250,0.55); }
    .btn.warn{ background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.55); }
    .btn.danger{ background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.55); }

    main{
      padding: 12px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* People row */
    .people{
      background: var(--panel);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .people-header{ display:flex; align-items:center; gap:8px; padding: 6px; border-bottom: 1px dashed rgba(148,163,184,0.18); }
    .people-title{ font-weight: 800; font-size: 18px; }
    .people-actions{ margin-left:auto; display:flex; gap:6px; }
    .people-list{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap:10px; padding:8px 6px; }
    .person{
      display:flex; flex-direction:column; gap:8px;
      border: 2px solid rgba(148,163,184,0.18);
      border-radius: 16px; padding: 10px;
      background: var(--panel-2);
      cursor: default;
      min-height: 86px;
      position: relative;
    }
    .person.edit{ cursor: pointer; }
    .person-name{ font-weight: 800; }
    .person-status{ font-size: 12px; font-weight: 800; color: var(--muted); }
    .person-meta{ font-size: 12px; color: var(--muted); }
    .person-controls{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
      /* Calm child mode: reduce hover lift */
      body:not(.edit-on) .card:hover{ transform:none; }
      body:not(.edit-on) .btn:hover{ transform:none; }
      /* More air in people list (kept via grid gap above) */
    .person-select{ padding:8px; border-radius:10px; border:1px solid rgba(148,163,184,0.25); background: var(--panel); font-weight:700; }
    .person-input{ padding:8px; border-radius:10px; border:1px solid rgba(148,163,184,0.25); background: var(--panel-2); font-weight:700; }
    .person-chip{ padding:6px 8px; border-radius:999px; border:1px solid rgba(148,163,184,0.25); background: rgba(148,163,184,0.08); font-weight:700; cursor:pointer; }
    .person-chip:hover{ border-color: rgba(96,165,250,0.6); }

    .slot{
      background: var(--panel);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: var(--radius);
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .slot-header{
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      padding: 6px 6px 10px 6px;
      border-bottom: 1px dashed rgba(148,163,184,0.18);
    }
    .slot-title{
      font-weight: 800; font-size: 18px;
      letter-spacing: 0.2px;
      display:flex; align-items:center; gap:8px;
    }
    .slot-sub{
      font-size: 12px; color: var(--muted);
      margin-left: 4px;
    }
    .slot-actions{ margin-left:auto; display:flex; gap:6px; }

    .cards{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 10px;
      min-height: 48px;
    }

    .card{
      background: var(--card);
      border: 2px solid rgba(148,163,184,0.18);
      border-radius: 16px;
      padding: 10px;
      display:flex; gap:10px; align-items:center;
      min-height: 86px;
      position: relative;
      cursor: pointer;
      transition: 0.12s ease;
      outline:none;
    }
    .card:hover{ border-color: rgba(96,165,250,0.6); transform: translateY(-1px); }
    .card:focus-visible{ box-shadow: 0 0 0 4px var(--ring); }
    .card.done{
      background: var(--card-done);
      border-color: rgba(34,197,94,0.6);
      opacity: 0.92;
    }
    .card.now{
      border-color: rgba(96,165,250,0.9);
      box-shadow: 0 0 0 3px rgba(96,165,250,0.35);
    }

    .icon{
      width: 64px; height: 64px; flex: 0 0 64px;
      border-radius: 12px;
      background: rgba(148,163,184,0.08);
      display:grid; place-items:center;
      font-size: 36px;
      border: 1px solid rgba(148,163,184,0.18);
    }

    .card-text{
      display:flex; flex-direction:column; gap:4px;
      width: 100%;
    }
    .label{
      font-size: 18px; font-weight: 800; line-height: 1.2;
    }
    .time{
      font-size: 13px; color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .badge{
      position:absolute; top:8px; right:8px;
      font-size: 11px; font-weight: 800;
      padding: 4px 6px; border-radius: 999px;
      background: rgba(99,102,241,0.15);
      color: #c7d2fe;
      border: 1px solid rgba(99,102,241,0.45);
    }
    .badge.done{
      background: rgba(34,197,94,0.12);
      color: #bbf7d0;
      border-color: rgba(34,197,94,0.55);
    }

    .drag-handle{
      position:absolute; bottom:6px; right:6px;
      font-size: 12px; color: var(--muted);
      opacity: 0.7;
      display:none;
    }
    .edit-on .drag-handle{ display:block; }

    .empty{
      border: 2px dashed rgba(148,163,184,0.25);
      border-radius: 14px;
      padding: 12px;
      color: var(--muted);
      text-align:center;
      font-size: 14px; font-weight: 700;
    }

    /* Modal */
    .modal-backdrop{
      position: fixed; inset:0; background: rgba(0,0,0,0.6);
      display:none; place-items:center; z-index:100;
      padding: 12px;
    }
    .modal-backdrop.show{ display:grid; }
    .modal{
      width: 100%; max-width: 520px;
      background: var(--panel);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .modal h2{
      margin: 6px 4px 10px;
      font-size: 20px;
    }
    .modal .row{
      display:grid; grid-template-columns: 1fr 1fr; gap:8px;
      margin-bottom: 8px;
    }
    .modal label{
      font-size: 12px; font-weight: 800; color: var(--muted);
      margin: 2px 2px 4px; display:block;
    }
    .modal input, .modal select{
      width:100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.25);
      background: var(--panel-2);
      color: var(--text);
      font-size: 16px; font-weight: 700;
      outline:none;
    }

    .library{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap:8px; max-height: 260px; overflow:auto;
      padding: 6px; background: var(--panel-2);
      border-radius: 12px; border: 1px solid rgba(148,163,184,0.18);
    }
    .lib-item{
      background: rgba(148,163,184,0.06);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 12px; padding: 8px;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      cursor:pointer; transition:0.1s ease;
      text-align:center;
    }
    .lib-item:hover{ border-color: rgba(96,165,250,0.6); transform: translateY(-1px); }
    .lib-emoji{ font-size: 30px; }
    .lib-label{ font-size: 12px; font-weight: 800; color: var(--text); }

    .modal-actions{
      display:flex; gap:8px; justify-content:flex-end; margin-top: 10px;
    }

    footer{
      opacity:0.8; color: var(--muted); font-size: 12px;
      padding: 10px 12px; text-align:center;
    }

    @media (min-width: 720px){
      header .title{ font-size: 20px; }
      .slot-title{ font-size: 20px; }
      .label{ font-size: 20px; }
      .icon{ width: 72px; height: 72px; font-size: 40px; }
      .card{ min-height: 96px; }
    }
  </style>
</head>
<body>
<header>
  <div class="title">
    <span style="font-size:22px;">🧩</span>
    Bildstöd – Dagsplanerare
    <span class="pill" id="modePill">Barnläge</span>
  </div>

  <button class="btn blue" id="toggleModeBtn" aria-label="Växla vuxen/barnläge">🔒 Lås upp (vuxenläge)</button>
  <button class="btn" id="toggleTimesBtn" aria-label="Visa eller dölj tider">🕒 Visa tider</button>
  <button class="btn" id="toggleClockBtn" aria-label="Växla mellan analog och digital klocka" style="display:none;">🕐 Analog klocka</button>
  <button class="btn warn" id="resetDoneBtn" aria-label="Nollställ klarmarkeringar och rensa kort">↺ Nollställ & Rensa</button>
  <button class="btn" id="exportBtn" aria-label="Exportera dag som fil">⬇️ Exportera</button>
  <label class="btn" for="importInput" style="cursor:pointer;">⬆️ Importera</label>
  <input id="importInput" type="file" accept="application/json" style="display:none;" />
</header>

<main id="board"></main>

<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <h2 id="modalTitle">Lägg till aktivitet</h2>

    <div class="row">
      <div>
        <label for="activityText">Text (kort och tydlig)</label>
        <input id="activityText" placeholder="t.ex. Frukost" />
      </div>
      <div>
        <label for="activityTime">Tid (valfritt)</label>
        <input id="activityTime" placeholder="t.ex. 09:30" />
      </div>
    </div>

    <label>Välj bild (tryck på en ikon)</label>
    <div class="library" id="library"></div>

    <input id="activityEmoji" type="hidden" />

    <label>Vem är med? (valfritt)</label>
    <div id="participantsSection" style="display:flex; flex-wrap:wrap; gap:6px; padding:6px 0;"></div>

    <div class="modal-actions">
      <button class="btn" id="cancelBtn">Avbryt</button>
      <button class="btn danger" id="deleteBtn" style="display:none;">Ta bort</button>
      <button class="btn primary" id="saveBtn">Spara</button>
    </div>
  </div>
</div>

<!-- (people modal borttagen – inline-redigering används) -->

<footer>
  Lokal lagring i webbläsaren. Ingen inloggning. Inget data lämnar enheten.
</footer>

<script>
/* =========================================================
   Bildstöd – Dagsplanerare (frontend-only)
   Designad för barn med NPF: få val, stora ytor, stabil layout.
   ========================================================= */

// Fast slots (enkelt för barnet)
const DEFAULT_SLOTS = [
  { key: "morning",  label: "Morgon",      hint: "Start och rutiner" },
  { key: "forenoon", label: "Förmiddag",  hint: "Fokus/Skola" },
  { key: "lunch",    label: "Lunch",      hint: "Mat och paus" },
  { key: "afternoon",label: "Eftermiddag",hint: "Aktivitet/lek" },
  { key: "evening",  label: "Kväll",      hint: "Varva ner och sova" }
];

// Lugn, igenkännbar startbank av pictos (emoji som placeholder)
const LIBRARY = [
  {emoji:"🌅", text:"Vakna"}, {emoji:"🍞", text:"Frukost"}, {emoji:"🧥", text:"Klä på sig"},
  {emoji:"🪥", text:"Borsta tänder"}, {emoji:"💇", text:"Borsta håret"}, {emoji:"🚗", text:"Åka"},
  {emoji:"🏫", text:"Skola"}, {emoji:"📚", text:"Läsa"}, {emoji:"✏️", text:"Skola/Arbete"},
  {emoji:"🥪", text:"Mellis"}, {emoji:"🍲", text:"Lunch"}, {emoji:"🍝", text:"Middag"},
  {emoji:"🌳", text:"Ute"}, {emoji:"⚽", text:"Lek ute"}, {emoji:"🎨", text:"Rita"},
  {emoji:"🧱", text:"Bygga"}, {emoji:"🎲", text:"Spel"}, {emoji:"📺", text:"Skärmtid"},
  {emoji:"🚲", text:"Cykla"}, {emoji:"🧘", text:"Vila"}, {emoji:"📖", text:"Bok"},
  {emoji:"🛁", text:"Bada"}, {emoji:"😴", text:"Sova"}, {emoji:"💊", text:"Medicin"},
  {emoji:"🎵", text:"Musik"}, {emoji:"🤸", text:"Rörelse"}, {emoji:"🧹", text:"Städa"},
  // Tillägg enligt önskemål
  {emoji:"🐴", text:"Häst"},
  {emoji:"💻", text:"Dator"},
  {emoji:"💼", text:"Jobbar"},
  {emoji:"🧑‍🤝‍🧑", text:"Kompisar"},
  {emoji:"👧", text:"Syskon tjej"},
  {emoji:"👦", text:"Syskon kille"},
  {emoji:"👩", text:"Mamma"},
  {emoji:"👨", text:"Pappa"},
  {emoji:"👵", text:"Mormor"},
];

const STORAGE_KEY = "bildstod_plan_v1";

// Safe UUID helper (fallback if crypto.randomUUID is unavailable)
function safeUUID(){
  try{
    if (window.crypto && typeof window.crypto.randomUUID === 'function'){
      return window.crypto.randomUUID();
    }
  }catch(e){}
  return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// ----- State -----
// Huvudapplikationens state-objekt: slots, items, people.
// Migreras automatiskt från äldre versioner via loadState() för bakåtkompatibilitet.
let state = loadState() || makeDefaultState();
let editMode = false;       // Barnläge default; om true = vuxenläge
let showTimes = false;      // Visa tider på aktivitetskort
let showAnalogClock = loadClockPreference(); // Analog/digital klockläge (sparas i localStorage)
let editingContext = null;  // {slotKey, itemId} för modal-kontext

// ----- Init -----
const boardEl = document.getElementById("board");
const modePill = document.getElementById("modePill");
const toggleModeBtn = document.getElementById("toggleModeBtn");
const toggleTimesBtn = document.getElementById("toggleTimesBtn");
const toggleClockBtn = document.getElementById("toggleClockBtn");
const resetDoneBtn = document.getElementById("resetDoneBtn");
const exportBtn = document.getElementById("exportBtn");
const importInput = document.getElementById("importInput");

const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const activityText = document.getElementById("activityText");
const activityTime = document.getElementById("activityTime");
const activityEmoji = document.getElementById("activityEmoji");
const libraryEl = document.getElementById("library");
const participantsSection = document.getElementById("participantsSection");
const cancelBtn = document.getElementById("cancelBtn");
const saveBtn = document.getElementById("saveBtn");
const deleteBtn = document.getElementById("deleteBtn");

// People (inline only)
let editingPersonId = null; // not used for modal anymore
let addingPerson = false;
// Helper to get simple time options
const TIME_OPTS = ["","08:00","10:00","12:00","14:00","15:00","16:00","18:00","20:00"];

renderLibrary();
render();

// Initialize toggle button texts
toggleClockBtn.textContent = showAnalogClock ? "🕐 Digital klocka" : "🕐 Analog klocka";
toggleClockBtn.style.display = showTimes ? "inline-flex" : "none";

toggleModeBtn.addEventListener("click", () => {
  editMode = !editMode;
  modePill.textContent = editMode ? "Vuxenläge" : "Barnläge";
  toggleModeBtn.textContent = editMode ? "🔓 Lås (barnläge)" : "🔒 Lås upp (vuxenläge)";
  document.body.classList.toggle("edit-on", editMode);
  render();
});

toggleTimesBtn.addEventListener("click", () => {
  showTimes = !showTimes;
  toggleTimesBtn.textContent = showTimes ? "🕒 Dölj tider" : "🕒 Visa tider";
    toggleClockBtn.style.display = showTimes ? "inline-flex" : "none";
  render();
});

toggleClockBtn.addEventListener("click", () => {
  showAnalogClock = !showAnalogClock;
  toggleClockBtn.textContent = showAnalogClock ? "🕐 Digital klocka" : "🕐 Analog klocka";
  saveClockPreference(showAnalogClock);
  render();
});

resetDoneBtn.addEventListener("click", () => {
  if (!confirm("Nollställa KLAR och rensa alla kort?")) return;
  // Clear done flags first (for safety if items remain)
  for (const slot of state.slots){
    for (const id of slot.items){
      state.items[id].done = false;
    }
  }
  // Then clear all cards
  for (const slot of state.slots){
    slot.items = [];
  }
  state.items = {};
  saveState();
  render();
});

exportBtn.addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `bildstod-${state.id}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

importInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if (imported && imported.slots && imported.items){
      state = imported;
      saveState();
      render();
    } else {
      alert("Filen såg inte ut som en dagsplan.");
    }
  }catch(err){
    alert("Kunde inte läsa filen.");
  } finally {
    importInput.value = "";
  }
});

// Modal events
cancelBtn.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (e)=> {
  if (e.target === modalBackdrop) closeModal();
});

// (modal events borttagna)

saveBtn.addEventListener("click", () => {
  const text = activityText.value.trim();
  const time = activityTime.value.trim();
  const emoji = activityEmoji.value || "🟦";
  
  // Collect selected participants
  const selectedParticipants = [];
  const checkboxes = participantsSection.querySelectorAll("input[type='checkbox']:checked");
  checkboxes.forEach(cb => selectedParticipants.push(cb.value));

  if (!text){
    activityText.focus();
    return;
  }

  if (editingContext?.itemId){
    // Update existing
    const item = state.items[editingContext.itemId];
    item.text = text;
    item.time = time;
    item.emoji = emoji;
    item.participants = selectedParticipants;
  } else if (editingContext?.slotKey){
    // Add new
    const id = safeUUID();
    state.items[id] = { id, text, time, emoji, done:false, participants:selectedParticipants };
    const slot = state.slots.find(s=>s.key===editingContext.slotKey);
    slot.items.push(id);
  }

  saveState();
  closeModal();
  render();
});

deleteBtn.addEventListener("click", () => {
  if (!editingContext?.itemId) return;
  const {slotKey, itemId} = editingContext;
  const slot = state.slots.find(s=>s.key===slotKey);
  slot.items = slot.items.filter(id=>id!==itemId);
  delete state.items[itemId];
  saveState();
  closeModal();
  render();
});

// ----- Rendering -----
function render(){
  boardEl.innerHTML = "";
  // Personsektionen: "Dagens människor" – visar familjemedlemmar med status, aktiviteter och tider
  // Hjälper barnet att förstå vem som är tillgänglig just nu (här/borta/senare)
  const peopleEl = document.createElement("section");
  peopleEl.className = "people";
  const ph = document.createElement("div"); ph.className = "people-header";
  const pt = document.createElement("div"); pt.className = "people-title"; pt.textContent = "Dagens människor";
  ph.appendChild(pt);
  const pa = document.createElement("div"); pa.className = "people-actions";
  if (editMode){
    const addPersonBtn = document.createElement("button");
    addPersonBtn.className = "btn blue";
    addPersonBtn.textContent = "＋ Lägg till";
    addPersonBtn.addEventListener("click", ()=> openPeopleAddModal());
    pa.appendChild(addPersonBtn);
  }
  ph.appendChild(pa);
  peopleEl.appendChild(ph);
  const pl = document.createElement("div"); pl.className = "people-list";
  for (const person of state.people || []){
    const p = document.createElement("div");
    p.className = "person" + (editMode ? " edit" : "");
    p.dataset.personId = person.id;
    if (editMode){ p.title = "Redigera med kontroller"; }
    const nameEl = document.createElement("div"); nameEl.className = "person-name"; nameEl.textContent = person.name;
    // Inline delete icon on person card (edit mode)
    if (editMode){
      const delIcon = document.createElement("button");
      delIcon.type = "button";
      delIcon.className = "btn danger";
      delIcon.style.position = "absolute";
      delIcon.style.top = "6px";
      delIcon.style.left = "6px";
      delIcon.style.padding = "4px 6px";
      delIcon.style.fontSize = "12px";
      delIcon.textContent = "🗑️";
      delIcon.title = "Ta bort person";
      delIcon.addEventListener("click", (e)=>{
        e.stopPropagation();
        if (!confirm(`Ta bort ${person.name}?`)) return;
        if (!person.id){
          const idx = (state.people || []).indexOf(person);
          if (idx >= 0){ (state.people || []).splice(idx,1); }
        } else {
          state.people = (state.people || []).filter(p=>p.id!==person.id);
        }
        saveState();
        render();
      });
      p.appendChild(delIcon);
    }
    const statusEl = document.createElement("div"); statusEl.className = "person-status"; statusEl.textContent = statusLabel(person.status);
    const metaEl = document.createElement("div"); metaEl.className = "person-meta";
    const parts = [];
    if (person.withWhatText) parts.push(person.withWhatEmoji ? person.withWhatEmoji + " " + person.withWhatText : person.withWhatText);
    if (person.etaStart && person.etaEnd){ parts.push("mellan " + person.etaStart + " - " + person.etaEnd); }
    else if (person.eta){ parts.push("kommer ca " + person.eta); }
    metaEl.textContent = parts.join(" · ");
    p.appendChild(nameEl);
    p.appendChild(statusEl);
    if (parts.length) p.appendChild(metaEl);

    // Inline controls (adult mode)
    if (editMode){
      const controls = document.createElement("div");
      controls.className = "person-controls";

      // Inline edit för personnamn (snabb uppdatering utan modal)
      const nameLabel = document.createElement("span");
      nameLabel.className = "person-meta";
      nameLabel.textContent = "Namn:";
      controls.appendChild(nameLabel);
      
      const nameInput = document.createElement("input");
      nameInput.className = "person-input";
      nameInput.placeholder = "Skriv namn";
      nameInput.value = person.name || "";
      nameInput.addEventListener("input", ()=>{
        person.name = nameInput.value.trim();
        saveState();
      });
      controls.appendChild(nameInput);

      // Status select
      const statusSel = document.createElement("select");
      statusSel.className = "person-select";
      for (const opt of [{v:"here",l:"✅ här"},{v:"away",l:"🚗 borta"},{v:"later",l:"⏳ senare"}]){
        const o = document.createElement("option"); o.value = opt.v; o.textContent = opt.l; if (person.status===opt.v) o.selected = true; statusSel.appendChild(o);
      }
      statusSel.addEventListener("change", ()=>{ person.status = statusSel.value; saveState(); render(); });
      controls.appendChild(statusSel);

      // Activity dropdown
      const actLabel = document.createElement("span"); actLabel.className = "person-meta"; actLabel.textContent = "Gör:";
      controls.appendChild(actLabel);
      const actSelect = document.createElement("select"); actSelect.className = "person-select";
      const actNone = document.createElement("option"); actNone.value = ""; actNone.textContent = "—"; actSelect.appendChild(actNone);
      const libSimple = LIBRARY.filter(it => ["Häst","Dator","Spel","Lek ute","Ute","Cykla","Musik","Skola","Jobbar"].includes(it.text));
      for (const it of libSimple){
        const o = document.createElement("option"); o.value = it.text; o.textContent = `${it.emoji} ${it.text}`; actSelect.appendChild(o);
      }
      actSelect.value = person.withWhatText || "";
      actSelect.addEventListener("change", ()=>{
        const chosen = libSimple.find(x=>x.text===actSelect.value);
        if (chosen){ person.withWhatEmoji = chosen.emoji; person.withWhatText = chosen.text; }
        else { person.withWhatEmoji = ""; person.withWhatText = ""; }
        saveState(); render();
      });
      controls.appendChild(actSelect);

      // ETA range: start and end
      const etaStartSel = document.createElement("select"); etaStartSel.className = "person-select";
      for (const t of TIME_OPTS){ const o = document.createElement("option"); o.value = t; o.textContent = t === "" ? "Start —" : t; if (person.etaStart===t) o.selected = true; etaStartSel.appendChild(o); }
      const etaEndSel = document.createElement("select"); etaEndSel.className = "person-select";
      for (const t of TIME_OPTS){ const o = document.createElement("option"); o.value = t; o.textContent = t === "" ? "Slut —" : t; if (person.etaEnd===t) o.selected = true; etaEndSel.appendChild(o); }
      etaStartSel.addEventListener("change", ()=>{ person.etaStart = etaStartSel.value; saveState(); render(); });
      etaEndSel.addEventListener("change", ()=>{ person.etaEnd = etaEndSel.value; saveState(); render(); });
      controls.appendChild(etaStartSel);
      controls.appendChild(etaEndSel);

      // Delete person
      const delBtn = document.createElement("button");
      delBtn.type = "button";
      delBtn.className = "btn danger";
      delBtn.textContent = "🗑️ Ta bort";
      delBtn.addEventListener("click", ()=>{
        if (!confirm(`Ta bort ${person.name}?`)) return;
        if (!person.id){
          const idx = (state.people || []).indexOf(person);
          if (idx >= 0){ (state.people || []).splice(idx,1); }
        } else {
          state.people = (state.people || []).filter(p=>p.id!==person.id);
        }
        saveState();
        render();
      });
      controls.appendChild(delBtn);

      p.appendChild(controls);
    }
    pl.appendChild(p);
  }
  peopleEl.appendChild(pl);
  boardEl.appendChild(peopleEl);
  const nextId = findNextUndoneId();

  for (const slot of state.slots){
    const slotEl = document.createElement("section");
    slotEl.className = "slot";
    slotEl.dataset.slotKey = slot.key;

    const header = document.createElement("div");
    header.className = "slot-header";

    const title = document.createElement("div");
    title.className = "slot-title";
    title.textContent = slot.label;

    const sub = document.createElement("div");
    sub.className = "slot-sub";
    sub.textContent = slot.hint || "";

    header.appendChild(title);
    header.appendChild(sub);

    const actions = document.createElement("div");
    actions.className = "slot-actions";
    if (editMode){
      const addBtn = document.createElement("button");
      addBtn.className = "btn blue";
      addBtn.textContent = "＋ Lägg till";
      addBtn.addEventListener("click", ()=> openAddModal(slot.key));
      actions.appendChild(addBtn);
    }
    header.appendChild(actions);
    slotEl.appendChild(header);

    const cardsEl = document.createElement("div");
    cardsEl.className = "cards";
    cardsEl.dataset.dropSlot = slot.key;

    if (slot.items.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = editMode ? "Inga aktiviteter ännu. Tryck “Lägg till”." : "Tomt just nu.";
      cardsEl.appendChild(empty);
    }

    for (const id of slot.items){
      const item = state.items[id];
      const card = document.createElement("button");
      card.className = "card" + (item.done ? " done" : "") + (id === nextId ? " now" : "");
      card.type = "button";
      card.dataset.itemId = id;
      card.dataset.slotKey = slot.key;
      card.draggable = editMode;

      // Click behavior
      card.addEventListener("click", () => {
        if (editMode){
          openEditModal(slot.key, id);
        } else {
          item.done = !item.done;
          saveState();
          render();
        }
      });

      // Drag behavior (only edit mode)
      if (editMode){
        card.addEventListener("dragstart", onDragStart);
        card.addEventListener("dragend", onDragEnd);
      }

      const icon = document.createElement("div");
      icon.className = "icon";
      icon.textContent = item.emoji || "🟦";

      const txt = document.createElement("div");
      txt.className = "card-text";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = item.text;

      txt.appendChild(label);

      // Tidvisning: analog SVG-klocka eller bara digital text
      if (showTimes && item.time){
        if (showAnalogClock) {
          // Show analog clock
          const clockContainer = document.createElement("div");
          clockContainer.style.display = "flex";
          clockContainer.style.flexDirection = "column";
          clockContainer.style.alignItems = "center";
          clockContainer.style.gap = "4px";
          clockContainer.style.marginTop = "4px";
          
          const clock = renderAnalogClock(item.time);
          if (clock) {
            clockContainer.appendChild(clock);
            
            // Also show digital time as text below
            const timeText = document.createElement("div");
            timeText.className = "time";
            timeText.style.fontSize = "11px";
            timeText.textContent = item.time;
            clockContainer.appendChild(timeText);
            
            txt.appendChild(clockContainer);
          } else {
            // Fallback if time can't be parsed
            const timeEl = document.createElement("div");
            timeEl.className = "time";
            timeEl.textContent = item.time;
            txt.appendChild(timeEl);
          }
        } else {
          // Show digital time only
          const timeEl = document.createElement("div");
          timeEl.className = "time";
          timeEl.textContent = item.time;
          txt.appendChild(timeEl);
        }
      }

      // Visa deltagare på kortet (under tiden, i barnläge)
      // Från item.participants[] hämtar vi personnamn och visar som chips
      if (item.participants && item.participants.length > 0){
        const participantsEl = document.createElement("div");
        participantsEl.className = "time"; // Reuse time styling
        participantsEl.style.display = "flex";
        participantsEl.style.gap = "4px";
        participantsEl.style.alignItems = "center";
        participantsEl.style.flexWrap = "wrap";
        
        for (const personId of item.participants){
          const person = (state.people || []).find(p => p.id === personId);
          if (person){
            const chip = document.createElement("span");
            chip.style.fontSize = "12px";
            chip.style.fontWeight = "700";
            chip.textContent = person.name;
            participantsEl.appendChild(chip);
          }
        }
        txt.appendChild(participantsEl);
      }

      const badge = document.createElement("div");
      badge.className = "badge " + (item.done ? "done" : "");
      badge.textContent = item.done ? "KLAR" : (id===nextId ? "NU" : "");

      const handle = document.createElement("div");
      handle.className = "drag-handle";
      handle.textContent = "↕ dra";

      // Inline delete button in edit mode
      if (editMode){
        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn danger";
        del.style.position = "absolute";
        del.style.top = "6px";
        del.style.left = "6px";
        del.style.padding = "4px 6px";
        del.style.fontSize = "12px";
        del.textContent = "🗑️";
        del.title = "Ta bort aktivitet";
        del.addEventListener("click", (e)=>{
          e.stopPropagation();
          const s = state.slots.find(s=>s.key===slot.key);
          s.items = s.items.filter(x=>x!==id);
          delete state.items[id];
          saveState();
          render();
        });
        card.appendChild(del);
      }

      card.appendChild(icon);
      card.appendChild(txt);
      if (badge.textContent) card.appendChild(badge);
      card.appendChild(handle);

      cardsEl.appendChild(card);
    }

    // Drop zone
    if (editMode){
      cardsEl.addEventListener("dragover", onDragOver);
      cardsEl.addEventListener("drop", onDrop);
    }

    slotEl.appendChild(cardsEl);
    boardEl.appendChild(slotEl);
  }
}

function renderLibrary(){
  libraryEl.innerHTML = "";
  for (const it of LIBRARY){
    const el = document.createElement("div");
    el.className = "lib-item";
    el.tabIndex = 0;

    const emo = document.createElement("div");
    emo.className = "lib-emoji";
    emo.textContent = it.emoji;

    const lbl = document.createElement("div");
    lbl.className = "lib-label";
    lbl.textContent = it.text;

    el.appendChild(emo);
    el.appendChild(lbl);

    el.addEventListener("click", () => {
      activityEmoji.value = it.emoji;
      if (!activityText.value) activityText.value = it.text;
      highlightLibrary(it.emoji);
    });

    libraryEl.appendChild(el);
  }
}

function highlightLibrary(emoji){
  for (const child of libraryEl.children){
    child.style.borderColor = (child.querySelector(".lib-emoji").textContent === emoji)
      ? "rgba(34,197,94,0.9)"
      : "rgba(148,163,184,0.18)";
  }
}

// Rendera deltagarcheckboxar i modal för aktivitetsredigering
// Baseras på state.people[] och visar redan valda deltagare som checked
function renderParticipants(selectedIds = []){
  participantsSection.innerHTML = "";
  const people = state.people || [];
  if (people.length === 0){
    participantsSection.innerHTML = "<span style='color:var(--muted); font-size:12px;'>Inga personer tillagda ännu</span>";
    return;
  }
  
  for (const person of people){
    const label = document.createElement("label");
    label.style.display = "flex";
    label.style.alignItems = "center";
    label.style.gap = "4px";
    label.style.padding = "6px 10px";
    label.style.borderRadius = "999px";
    label.style.border = "1px solid rgba(148,163,184,0.25)";
    label.style.background = "rgba(148,163,184,0.08)";
    label.style.cursor = "pointer";
    label.style.fontSize = "14px";
    label.style.fontWeight = "700";
    
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = person.id;
    checkbox.checked = selectedIds.includes(person.id);
    
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(person.name));
    participantsSection.appendChild(label);
  }
}

// ----- Modal helpers -----
function openAddModal(slotKey){
  editingContext = {slotKey, itemId:null};
  modalTitle.textContent = "Lägg till aktivitet";
  activityText.value = "";
  activityTime.value = "";
  activityEmoji.value = "";
  highlightLibrary(null);
  renderParticipants([]);
  deleteBtn.style.display = "none";
  modalBackdrop.classList.add("show");

}

function openEditModal(slotKey, itemId){
  editingContext = {slotKey, itemId};
  const item = state.items[itemId];
  modalTitle.textContent = "Ändra aktivitet";
  activityText.value = item.text || "";
  activityTime.value = item.time || "";
  activityEmoji.value = item.emoji || "";
  highlightLibrary(item.emoji);
  renderParticipants(item.participants || []);
  deleteBtn.style.display = "inline-flex";
  modalBackdrop.classList.add("show");

function closeModal(){
  modalBackdrop.classList.remove("show");

}

// Add person (inline create)
function openPeopleAddModal(){
  // create minimal new person and push
  const id = safeUUID();
  const newPerson = { id, name:"Person", status:"here", eta:"", withWhatEmoji:"", withWhatText:"", etaStart:"", etaEnd:"" };
  state.people = state.people || [];

// ----- Drag and drop -----
let dragItemId = null;
let dragFromSlot = null;

function onDragStart(e){
  dragItemId = e.currentTarget.dataset.itemId;
  dragFromSlot = e.currentTarget.dataset.slotKey;
  e.dataTransfer.effectAllowed = "move";
  e.currentTarget.style.opacity = "0.6";
}

function onDragEnd(e){
  e.currentTarget.style.opacity = "1";
  dragItemId = null;
  dragFromSlot = null;
}

function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
}

function onDrop(e){
  e.preventDefault();
  const toSlotKey = e.currentTarget.dataset.dropSlot;
  if (!dragItemId || !dragFromSlot) return;

  if (toSlotKey === dragFromSlot){
    // Reorder within same slot by dropping near end (simple MVP)
    // We'll move to end if same slot
    const slot = state.slots.find(s=>s.key===toSlotKey);
    slot.items = slot.items.filter(id=>id!==dragItemId);
    slot.items.push(dragItemId);
  } else {
    // Move between slots
    const fromSlot = state.slots.find(s=>s.key===dragFromSlot);
    const toSlot = state.slots.find(s=>s.key===toSlotKey);
    fromSlot.items = fromSlot.items.filter(id=>id!==dragItemId);
    toSlot.items.push(dragItemId);
  }

  saveState();
  render();
}

// ----- Logic helpers -----
// parseTime: Parsa tid från sträng (t.ex. "09:30" eller "10:00–11:00")
// För intervall extraheras första tiden. Returnerar {hours, minutes}.
function parseTime(timeString) {
  if (!timeString) return {hours: null, minutes: null};
  
  // Hantera intervall: ta första tiden
  const firstTime = timeString.split(/[-–—]/)[0].trim();
  
  const match = firstTime.match(/^(\d{1,2}):(\d{2})$/);
  if (!match) return {hours: null, minutes: null};
  
  return {
    hours: parseInt(match[1], 10),
    minutes: parseInt(match[2], 10)
  };
}

// createHand: Hjälpfunktion för SVG-tidvisare
// Skapar en linje från centrum (cx, cy) med given längd och vinkel
function createHand(cx, cy, length, angle, width) {
  const rad = (angle - 90) * Math.PI / 180;
  const x2 = cx + length * Math.cos(rad);
  const y2 = cy + length * Math.sin(rad);
  
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("x1", cx);
  line.setAttribute("y1", cy);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);
  line.setAttribute("stroke", "var(--text)");
  line.setAttribute("stroke-width", width);
  line.setAttribute("stroke-linecap", "round");
  
  return line;
}

// renderAnalogClock: Skapar SVG-baserad analog klocka från "HH:MM" format
// Visar urtavla, timmärken, timvisare och minutvisare.
// Returnerar SVG-element eller null om tiden är felaktig.
function renderAnalogClock(timeString) {
  const {hours, minutes} = parseTime(timeString);
  if (hours === null) return null;
  
  const hourAngle = (hours % 12) * 30 + minutes * 0.5;
  const minuteAngle = minutes * 6;
  
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("width", "48");
  svg.setAttribute("height", "48");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.style.display = "block";
  
  // Urtavla
  const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circle.setAttribute("cx", "50");
  circle.setAttribute("cy", "50");
  circle.setAttribute("r", "45");
  circle.setAttribute("fill", "var(--panel-2)");
  circle.setAttribute("stroke", "var(--text)");
  circle.setAttribute("stroke-width", "2");
  
  // Timmärken (små streck)
  const hourMarks = document.createElementNS("http://www.w3.org/2000/svg", "g");
  for (let i = 0; i < 12; i++) {
    const angle = i * 30;
    const rad = (angle - 90) * Math.PI / 180;
    const x1 = 50 + 40 * Math.cos(rad);
    const y1 = 50 + 40 * Math.sin(rad);
    const x2 = 50 + 45 * Math.cos(rad);
    const y2 = 50 + 45 * Math.sin(rad);
    
    const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
    mark.setAttribute("x1", x1);
    mark.setAttribute("y1", y1);
    mark.setAttribute("x2", x2);
    mark.setAttribute("y2", y2);
    mark.setAttribute("stroke", "var(--muted)");
    mark.setAttribute("stroke-width", i % 3 === 0 ? "2" : "1");
    hourMarks.appendChild(mark);
  }
  
  // Timvisare
  const hourHand = createHand(50, 50, 25, hourAngle, 5);
  
  // Minutvisare
  const minuteHand = createHand(50, 50, 38, minuteAngle, 3);
  
  // Centrumpunkt
  const center = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  center.setAttribute("cx", "50");
  center.setAttribute("cy", "50");
  center.setAttribute("r", "4");
  center.setAttribute("fill", "var(--text)");
  
  svg.appendChild(circle);
  svg.appendChild(hourMarks);
  svg.appendChild(hourHand);
  svg.appendChild(minuteHand);
  svg.appendChild(center);
  
  return svg;
}

function findNextUndoneId(){
  for (const slot of state.slots){
    for (const id of slot.items){
      if (!state.items[id].done) return id;
    }
  }
  return null;
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try{
    const loaded = JSON.parse(raw);
    // Migration: lägg till participants-array till items om de saknas
    // Detta gör app bakåtkompatibel med äldre sparade dagsplaner
    if (loaded && loaded.items){
      for (const id in loaded.items){
        if (!loaded.items[id].participants){
          loaded.items[id].participants = [];
        }
      }
    }
    return loaded;
  }
  catch{ return null; }
}

// ----- People helpers -----
// statusLabel: Konverterar status-värde till emoji-text för visning
function statusLabel(s){
  if (s === "here") return "✅ här";
  if (s === "away") return "🚗 borta";
  return "⏳ senare";
}

// loadClockPreference: Hämta sparad analog/digital-inställning från localStorage
function loadClockPreference() {
  const saved = localStorage.getItem("bildstod_clock_mode");
  return saved === "analog";
}

// saveClockPreference: Spara användarens val av analog eller digital klocka
function saveClockPreference(isAnalog) {
  localStorage.setItem("bildstod_clock_mode", isAnalog ? "analog" : "digital");
}
